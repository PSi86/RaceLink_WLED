; ------------------------------------------------------------------------------
; RaceLink Ethernet node v7 -- GLEDOPTO Elite 2D-EXMU (GL-C-616WL).
; Classic ESP32 (NOT S2/S3) using the INTERNAL Ethernet MAC (EMAC) + external
; LAN8720 RMII PHY. Transport = UDP over the shared lwIP stack (WiFiUDP), selected
; by -D RACELINK_ETH_EMAC (racelink_transport_eth_emac.h). Unlike the v5 W5500
; node, the PHY/DHCP are owned by WLED's native Ethernet support:
;   -D WLED_USE_ETHERNET -D WLED_ETH_DEFAULT=WLED_ETH_GLEDOPTO
; (board table entry 13 in WLED const.h/network.cpp -- LAN8720, addr 1, MDC 23,
;  MDIO 33, power 5, clk GPIO0_IN; see WLED PR #5156).
;
; Over Ethernet only RaceLink runs. The WiFi AP is KEPT for config/recovery (the
; usermod's triple-tap AP gesture). WLED's web server binds 0.0.0.0, so the UI is
; also reachable over the Ethernet IP -- accepted for the closed RaceLink LAN.
;
; Pin map (GL-C-616WL, from the GLEDOPTO manual):
;   LED out 1 = GPIO16, LED out 2 = GPIO2, button/DIY = GPIO13, relay = GPIO18.
;   EMAC consumes GPIO 0,5,19,21,22,23,25,26,27,33 (do NOT use for LEDs/button).
;
; DEV_TYPE 14 = NODE_WLED_ETH_GLEDOPTO.
; NOTE: register DEV_TYPE 14 in the host device-type table so the UI labels it.
; ------------------------------------------------------------------------------

[platformio]
default_envs = RaceLink_Node_v7_classic_esp32_emac

[env:RaceLink_Node_v7_classic_esp32_emac]
extends = esp32
framework = arduino
board = esp32dev
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
board_build.partitions = ${esp32.default_partitions}
board_build.flash_mode = dio
custom_usermods = https://github.com/PSi86/RaceLink_WLED.git#main battery
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32.build_flags}

  -D DEV_TYPE=14 ;; custom device type for RaceLink_Node V7 (internal-EMAC Ethernet) -- NODE_WLED_ETH_GLEDOPTO
  -D WLED_RELEASE_NAME=\"RaceLink_Node_V7_TYPE_14\"
  -D WLED_AP_SSID='"WLED_RaceLink_AP"'

  ;-D WLED_DEBUG

  -DARDUINO_USB_CDC_ON_BOOT=0 ;; mandatory for "classic ESP32" with arduino-esp32 >=2.0.3

  -D ESP32
  -D ARDUINO_ARCH_ESP32

  -D WLED_WATCHDOG_TIMEOUT=0

  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_PXMAGIC
  -D WLED_DISABLE_ESPNOW ;; ESP-NOW needs WiFi; keep off (GLEDOPTO clk = GPIO0_IN so no clock conflict, but unused here)

  -D WLED_MAX_BUTTONS=2 ;; reset + mode
  -D BTNPIN=13 ;; GL-C-616WL DIY/sensor port (GPIO0 is the ETH clock, so the usual BTNPIN=0 is unavailable)
  -D WLED_MAX_BUSSES=2 ;; two LED outputs
  -D DATA_PINS=16,2 ;; GL-C-616WL LED output terminals (GPIO16, GPIO2)
  -D LED_TYPES=TYPE_WS2812_RGB,TYPE_WS2812_RGB ;; see const.h (TYPE_xxxx)
  -D DEFAULT_LED_COLOR_ORDER=COL_ORDER_GRB ;; see const.h (COL_ORDER_xxxx)
  -D PIXEL_COUNTS=100 ;; number of LEDs on the strip
  -D RLYPIN=-1 ;; relay disabled by default (GL-C-616WL relay sits on GPIO18; set in UI if used)

  -D WLED_LONG_FACTORY_RESET=15000 ;; long press for reset duration in ms
  -D WLED_LONG_AP=5000 ;; long press for AP duration in ms

  ; --- RaceLink / internal-EMAC Ethernet (GLEDOPTO GL-C-616WL, LAN8720) ---
  -D WLED_USE_ETHERNET ;; WLED brings up the PHY/DHCP and reserves the RMII pins
  -D WLED_ETH_DEFAULT=WLED_ETH_GLEDOPTO ;; board table entry 13 (resolves once cfg.json saves it)
  -D RACELINK_ETH_EMAC ;; transport selector (also defines RACELINK_ETH via racelink_wled.h shim)
  -D RACELINK_ETH_NODE_PORT=5078 ;; UDP listen port
  -D RACELINK_ETH_HOST_PORT=5079 ;; fallback reply port (host endpoint is learned at runtime)

  ;; Battery usermod is pulled for fleet build parity but this is a mains-powered
  ;; device -- point the measurement at a free input-only ADC1 pin (GPIO34) and
  ;; keep auto-off/low-power off so it never acts on bogus readings.
  -D USERMOD_BATTERY_MEASUREMENT_PIN=34
  -D USERMOD_BATTERY_MEASUREMENT_INTERVAL=20000
  -D USERMOD_BATTERY_DEFAULT_TYPE=2 ; LiIon
  -D USERMOD_BATTERY_AUTO_OFF_ENABLED=false
  -D USERMOD_BATTERY_LOW_POWER_INDICATOR_ENABLED=false

upload_speed = 460800
;; Internal EMAC: no external Ethernet lib. RadioLib is still pulled via the
;; usermod library.json but unused on Ethernet builds.
lib_deps = ${esp32.lib_deps}
