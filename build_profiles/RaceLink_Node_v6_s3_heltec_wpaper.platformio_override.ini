; ------------------------------------------------------------------------------
; RaceLink Startblock -- Heltec Wireless Paper v1.2 (ESP32-S3FN8, SX1262, 2.13" e-paper)
;
; Hardware: Heltec "Wireless Paper" -- ESP32-S3FN8 (8 MB flash, no PSRAM), Semtech
; SX1262 LoRa, 2.13" 250x122 B/W e-paper (panel LCMEN2R13EFC1, Fitipower JD79656
; controller). The JD79656 is NOT supported by stock GxEPD2; this profile pins
; Meshtastic's GxEPD2 fork (which adds the GxEPD2_213_FC1 driver) and selects it
; via -D RACELINK_EPAPER_PANEL_FC1.
;
; DEV_TYPE 51 = Startblock (Heltec Wireless Paper). 50 is the v3 e-paper Startblock;
; both are gated together via the RACELINK_STARTBLOCK flag in racelink_wled.h.
; NOTE: register DEV_TYPE 51 in the host device-type table so the UI labels it.
;
; Pinout cross-checked against Meshtastic variants/esp32s3/heltec_wireless_paper.
; ------------------------------------------------------------------------------

[platformio]
default_envs = RaceLink_Node_v6_s3_heltec_wpaper

[env:RaceLink_Node_v6_s3_heltec_wpaper]
extends = esp32s3
framework = arduino
platform = ${esp32s3.platform}
board = esp32-s3-devkitc-1
board_build.partitions = ${esp32.default_partitions}
board_build.flash_mode = qio
board_build.f_flash = 80000000L
;; ESP32-S3FN8: 8 MB internal flash, NO PSRAM.
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
custom_usermods = https://github.com/PSi86/RaceLink_WLED.git#main battery
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32s3.build_flags}

  -D DEV_TYPE=51 ;; Startblock device code for the Heltec Wireless Paper (50 = v3 e-paper node)
  -D WLED_RELEASE_NAME=\"RaceLink_Node_V6_HeltecWPaper_TYPE_51\"
  -D WLED_AP_SSID='"WLED_RaceLink_AP"'

  ;-D WLED_DEBUG ;; enable for serial diagnostics (RX/REJECT + cfg.json load/save)

  -D ARDUINO_USB_CDC_ON_BOOT=0  ;; for boards with serial-to-USB chip
  ;-D ARDUINO_USB_MSC_ON_BOOT=0
  ;-D ARDUINO_USB_DFU_ON_BOOT=0
  ;-D BOARD_HAS_PSRAM ;; ESP32-S3FN8 has no PSRAM

  -D ESP32
  -D ARDUINO_ARCH_ESP32
  -D ARDUINO_ARCH_ESP32S3
  -D CONFIG_IDF_TARGET_ESP32S3=1
  -D CO

  -D WLED_WATCHDOG_TIMEOUT=0

  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_INFRARED
  ;-D WLED_DISABLE_WEBSOCKETS
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ADALIGHT
  ;-D WLED_DISABLE_2D
  -D WLED_DISABLE_PXMAGIC
  -D WLED_DISABLE_ESPNOW

  ;-D LED_BUILTIN=2 ;; # GPIO of built-in LED
  ;-D WLED_MAX_ANALOG_CHANNELS=0 ;; no PWM HW pins available NOT working, can still configure in UI
  -D WLED_MAX_BUTTONS=2 ;; we use 2 buttons (reset, mode)
  -D BTNPIN=0 ;; GPIO of mode button (Heltec PRG button on GPIO0)
  -D WLED_MAX_BUSSES=2 ;; we only need 2 LED strips
  ;; LED data pins -- PLACEHOLDER. Must NOT collide with e-paper (2-7), LoRa (8-14)
  ;; or Vext (45). 47/48 are free, output-capable, broken-out S3 GPIOs. Adjust to
  ;; match your actual LED-strip wiring.
  -D DATA_PINS=47,48 ;; GPIO of data pins for LED strips
  -D LED_TYPES=TYPE_WS2812_RGB,TYPE_WS2812_RGB ;; see const.h (TYPE_xxxx)
  -D DEFAULT_LED_COLOR_ORDER=COL_ORDER_GRB ;; see const.h (COL_ORDER_xxxx)
  -D PIXEL_COUNTS=100 ;; number of LEDs on the strip

  -D WLED_LONG_FACTORY_RESET=15000 ;; long press for reset duration in ms
  -D WLED_LONG_AP=5000 ;; long press for AP duration in ms

  ; --- RaceLink / SX1262 LoRa: fixed pins of the Heltec Wireless Paper ---
  -D RACELINK_SX1262
  -D RACELINK_PIN_SCK=9
  -D RACELINK_PIN_MISO=11
  -D RACELINK_PIN_MOSI=10
  -D RACELINK_PIN_NSS=8
  -D RACELINK_PIN_DIO1=14   ;; SX1262 DIO1 (interrupt)
  -D RACELINK_PIN_BUSY=13   ;; SX1262 BUSY
  -D RACELINK_PIN_RST=12

  ; --- LoRa RF parameters (EU-typical, adjust as needed) ---
  ;868000000UL
  -D RACELINK_FREQ_HZ=867700000UL
  -D RACELINK_BW_KHZ=125.0
  -D RACELINK_SF=7
  -D RACELINK_CR=5
  -D RACELINK_SYNC_WORD=0x12
  -D RACELINK_PREAMBLE=8
  -D RACELINK_TX_POWER=14

  ; --- e-paper: 2.13" 250x122 B/W, panel LCMEN2R13EFC1 / JD79656 controller ---
  ; Driven via the GxEPD2_213_FC1 class from the Meshtastic GxEPD2 fork (see lib_deps).
  -D RACELINK_EPAPER
  ;; Heltec ships the Wireless Paper with two different 2.13" panels (factory FW
  ;; auto-detects). E0213A367 (SSD1682) is the current variant; switch to
  ;; RACELINK_EPAPER_PANEL_FC1 (JD79656) if your board has that panel instead.
  -D RACELINK_EPAPER_PANEL_E0213A367   ;; select GxEPD2_213_E0213A367 (SSD1682)
  -D RACELINK_EPAPER_MOSI=2
  -D RACELINK_EPAPER_SCK=3
  -D RACELINK_EPAPER_MISO=-1     ;; e-paper has no MISO
  -D RACELINK_EPAPER_CS=4
  -D RACELINK_EPAPER_DC=5
  -D RACELINK_EPAPER_RST=6
  -D RACELINK_EPAPER_BUSY=7
  ;; Vext gates the e-ink power rail. Active LOW: drive GPIO45 LOW to power the panel.
  -D RACELINK_EPAPER_VEXT=45
  -D RACELINK_EPAPER_VEXT_ON=0

  ;-D USERMOD_BATTERY ;; enabled in custom_usermods, only config here
  -D USERMOD_BATTERY_MEASUREMENT_PIN=1 ;; GPIO pin to measure battery voltage (verify on this board)
  -D USERMOD_BATTERY_MEASUREMENT_INTERVAL=20000 ;; in ms default: 30000 (30s)
  -D USERMOD_BATTERY_DEFAULT_TYPE=2 ; LiIon
  -D USERMOD_BATTERY_AUTO_OFF_ENABLED=false
  -D USERMOD_BATTERY_AUTO_OFF_THRESHOLD=5
  -D USERMOD_BATTERY_LOW_POWER_INDICATOR_ENABLED=false
  -D USERMOD_BATTERY_LOW_POWER_INDICATOR_THRESHOLD=10
  -D USERMOD_BATTERY_LOW_POWER_INDICATOR_PRESET=2
  -D USERMOD_BATTERY_LOW_POWER_INDICATOR_DURATION=5
  -D USERMOD_BATTERY_AVERAGING_ALPHA=0.2f ;; no averaging, 0.1f=strong averaging
  -D USERMOD_BATTERY_VOLTAGE_MULTIPLIER=11.2f ; default for esp32

upload_speed = 460800
lib_deps = ${esp32s3.lib_deps}
  jgromes/RadioLib @ ^7.4.0 ; RadioLib for RaceLink
  ;; Meshtastic GxEPD2 fork -- adds GxEPD2_213_FC1 (JD79656) for the Heltec Wireless Paper.
  ;; Pinned commit; do NOT also add zinggjm/GxEPD2 (only one GxEPD2 per build).
  https://github.com/meshtastic/GxEPD2/archive/c7eb4c3c167cf396ef4f541cc5d4c6aa42f3c46b.zip
